[project]
name = "ocr-tts"
version = "0.1.0"
description = "OCR to audiobook web app — browser PDF extraction, LLM OCR, and TTS"
readme = "README.md"
authors = [{ name = "Ryan Parker" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    # Required by the vision-LLM OCR engine (OpenAI-compatible API, e.g. llama.cpp).
    "markdownify>=1.2.3",
    "openai>=3.0.0",
    "pocket-tts>=2.1.0",
    "ptts>=0.6.0",
    "pydantic>=2.0.0",
    # python-multipart is required for file upload in FastAPI
    "python-multipart>=0.0.9",
    "readability-lxml>=0.9",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
# PyAV is used for FFMPEG bindings, enabling I/O for compressed
# audio formats like webm and mp3.
av = ["av>=14.0.0"]

[project.scripts]
app = "backend.app.main:main"

[dependency-groups]
dev = [
    # Starlette 1.6+ TestClient prefers httpx2 (the httpx path is deprecated).
    "httpx2>=2.12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.0",
    "ty>=0.0.13",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

# B008 (function call in default argument) is idiomatic for FastAPI's
# File(...)/Form(...) declarations, which require these calls in parameter
# defaults.
[tool.ruff.lint.per-file-ignores]
"backend/app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.12"
